name: Build ImmortalWrt 24.10 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新增：获取当前日期
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: |
          # 克隆 24.10 仓库源码 (因为 6.6 内核对应 24.10 版本)
          git clone https://github.com/tfnhui/immortalwrt-mt798x-6.6.git openwrt
          cd openwrt

          # 复制配置文件（请确认此路径是否正确）
          cp ../.github/workflows/.config .config

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 生成完整配置
          #make defconfig

          # 下载依赖（多线程）
          make download -j$(nproc)

          # 编译（先多核，失败转单核调试）
          make -j$(nproc) || make -j1 V=s
          
          # 删除 packages 目录（不需要上传）
          rm -rf bin/targets/mediatek/filogic/packages
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
 
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "RAX3000M 固件 ${{ steps.date.outputs.date }} #${{ github.run_number }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body: |
            ## 自动编译固件
            
            - 编译时间：${{ steps.date.outputs.date }}
            - 编译编号：#${{ github.run_number }}
            - 设备：CMCC RAX3000M (eMMC / NAND)
            - 内核：6.6（24.10 版本）
            - 包含插件：OpenClash、磁盘管理、Argon 主题等
          files: |
            openwrt/bin/targets/mediatek/filogic/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
