name: Build ImmortalWrt 6.6 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Build firmware
        run: |
          # 克隆源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-6.6.git openwrt
          cd openwrt

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 使用基础配置
          cp defconfig/mt7981-ax3000.config .config

          # 写入 RAX3000M EMMC 专属配置 + 插件
          cat >> .config << 'EOF'
          # 设备选择
          CONFIG_TARGET_mediatek_filogIC_DEVICE_cmcc_rax3000m-emmc-mtk=y
          CONFIG_TARGET_PROFILE="DEVICE_cmcc_rax3000m-emmc-mtk"
          CONFIG_TARGET_ROOTFS_PARTSIZE=160

          # 必装插件
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-diskman=y
          CONFIG_PACKAGE_luci-app-diskman_INCLUDE_btrfs_progs=y
          CONFIG_PACKAGE_luci-app-diskman_INCLUDE_lsblk=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-turboacc-mtk=y
          CONFIG_PACKAGE_luci-app-wrtbwmon=y

          # OpenClash 必备依赖
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-ipt-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-ipt-offload=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_iptables-mod-filter=y
          CONFIG_PACKAGE_iptables-mod-nat-extra=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libcap=y
          CONFIG_PACKAGE_openssl-util=y

          # 中文语言包
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-diskman-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wrtbwmon-zh-cn=y
          CONFIG_PACKAGE_default-settings-chn=y
          EOF

          # 生成完整配置
          make defconfig

          # 下载依赖（多线程）
          make download -j$(nproc)

          # 编译（先多核，失败转单核调试）
          make -j$(nproc) || make -j1 V=s

          # 清理无用文件，只保留固件
          rm -rf bin/targets/mediatek/filogic/packages
          rm -rf bin/targets/mediatek/filogic/*.buildinfo
          rm -rf bin/targets/mediatek/filogic/*.json

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rax3000m-emmc-6.6
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
