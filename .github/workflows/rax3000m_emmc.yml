name: Build ImmortalWrt 6.6 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          # 克隆源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-6.6.git openwrt
          cd openwrt

          # 复制配置文件
          cp ../.github/workflows/.config .config

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 生成完整配置
          make defconfig

          # 下载依赖（多线程）
          make download -j$(nproc)

          # 编译（先多核，失败转单核调试）
          make -j$(nproc) || make -j1 V=s
          
          # 删除 packages 目录（不需要上传）
          rm -rf bin/targets/mediatek/filogic/packages
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rax3000m-emmc-6.6
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
