name: Build ImmortalWrt 6.6 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          # 克隆 kernel 6.6 版本的仓库源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-6.6.git openwrt
          cd openwrt

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 复制 RAX3000M 的配置文件（MT7981 芯片通用）
          cp defconfig/mt7981-ax3000.config .config

          # 生成完整配置
          make defconfig

          # 下载编译所需的源码包
          make download -j8

          # 开始编译，如果失败则单线程详细输出调试
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-6.6-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/mt7981/
