name: Build ImmortalWrt 6.6 for RAX3000M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          # 克隆 kernel 6.6 版本的仓库源码
          git clone https://github.com/tfnhui/immortalwrt-mt798x-6.6.git openwrt
          cd openwrt

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 复制基础配置
          cp defconfig/mt7981-ax3000.config .config
          
          # 手动选择 RAX3000M 设备
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_cmcc_rax3000m=y" >> .config
          
          # 可选：取消选择其他不需要的设备，避免编译多余的固件
          # 取消可能默认选中的其他设备（如果有的话）
          sed -i '/CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_/s/=y/=n/' .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_cmcc_rax3000m=y" >> .config

          # 生成完整配置
          make defconfig
          
          # 验证配置是否正确
          echo "=== 验证 RAX3000M 是否被选中 ==="
          grep "CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_rax3000m" .config
          echo "=== 当前将编译的设备列表 ==="
          grep "CONFIG_TARGET_DEVICE.*=y" .config | grep -v "DEPENDS"

          # 下载编译所需的源码包
          make download -j8

          # 开始编译，如果失败则单线程详细输出调试
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-6.6-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/mt7981/
