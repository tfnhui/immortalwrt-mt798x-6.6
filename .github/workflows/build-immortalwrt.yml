name: Build ImmortalWrt for RAX3000M with OpenClash

on:
  workflow_dispatch:
    inputs:
      openclash_version:
        description: 'OpenClash version'
        required: false
        default: 'master'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build firmware
      uses: padavanonly/immortalwrt-mt798x-6.6@openwrt-24.10-6.6
      with:
        device: cmcc_rax3000m
        custom-patches: |
          # 添加 OpenClash 软件源
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default
        extra-packages: |
          luci-app-openclash
